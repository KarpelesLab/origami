[workspace]
resolver = "2"
members = [
    "crates/chem",
    "crates/translate",
    "crates/geom",
    "crates/energy",
    "crates/dynamics",
    "crates/io",
    "crates/cli",
    "crates/gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/KarpelesLab/origami"

[workspace.lints.clippy]
# Numeric kernels index several parallel arrays (positions, forces,
# masses, …) by atom; iterator rewrites obscure that without gain.
needless_range_loop = "allow"
# Physics entry points legitimately take many scalar parameters.
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
approx = "0.5"
nalgebra = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
wgpu = { version = "23", default-features = false, features = ["metal", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
